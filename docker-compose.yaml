services:
  whatsapp-mcp:
    build: .
    expose:
      - "8000"
    environment:
      MCP_TRANSPORT: sse
      PORT: "8000"
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:?set MCP_SHARED_SECRET in your .env file}
    volumes:
      - whatsapp-store:/app/whatsapp-bridge/store
    restart: unless-stopped

volumes:
  whatsapp-store:
